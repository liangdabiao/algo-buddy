# Hand-curated quiz bank for the eight core chapters.
# Merged into data/content.json by extract_content.py.
# Each item: section id, question, exactly 4 unique options, one answer.

- section: ch02_01
  question: 算法效率评估中，为什么通常不直接统计运行时间？
  options:
    - 运行时间受硬件、软件环境和数据规模等多种因素干扰，难以公平比较
    - 运行时间无法被测量
    - 统计运行时间的成本太高，需要大型计算机
    - 因为算法在所有机器上运行时间完全相同
  answer: 运行时间受硬件、软件环境和数据规模等多种因素干扰，难以公平比较

- section: ch02_02
  question: 以下关于递归的说法，错误的是？
  options:
    - 递归一定比迭代的时间复杂度更低
    - 递归由「递」和「归」两个阶段构成
    - 尾递归可以被编译器优化为迭代形式
    - 递归过深可能导致调用栈溢出
  answer: 递归一定比迭代的时间复杂度更低

- section: ch02_03
  question: 时间复杂度 O(log n) 最典型的特征是？
  options:
    - 每一轮把问题规模缩小为原来的一半（或常数分之一）
    - 问题规模每轮增加一倍
    - 循环执行恰好 n 次
    - 只能出现在排序算法中
  answer: 每一轮把问题规模缩小为原来的一半（或常数分之一）

- section: ch02_03
  question: 以下复杂度从低到高排列，正确的是？
  options:
    - O(1) < O(log n) < O(n) < O(n²)
    - O(1) < O(n) < O(log n) < O(n²)
    - O(log n) < O(1) < O(n²) < O(n)
    - O(n) < O(n²) < O(1) < O(log n)
  answer: O(1) < O(log n) < O(n) < O(n²)

- section: ch02_03
  question: 「最差时间复杂度」与「平均时间复杂度」的关系，理解正确的是？
  options:
    - 最差复杂度给出效率上界，平均复杂度反映随机输入下的期望效率
    - 两者在任何输入下都相等
    - 平均复杂度一定比最差复杂度低一个数量级
    - 最差复杂度没有实际意义，可以忽略
  answer: 最差复杂度给出效率上界，平均复杂度反映随机输入下的期望效率

- section: ch02_04
  question: 以下哪种做法属于「以空间换时间」？
  options:
    - 用哈希表缓存查询结果，把查找从 O(n) 降到 O(1)
    - 把递归改写为迭代
    - 减少数组中存储的元素数量
    - 使用循环代替循环嵌套
  answer: 用哈希表缓存查询结果，把查找从 O(n) 降到 O(1)

- section: ch02_05
  question: 判断时间复杂度时，通常统计的是哪类操作的次数？
  options:
    - 增长最快的操作类别（如嵌套循环内的比较）
    - 程序中所有字符的数量
    - 注释和空行的数量
    - 变量声明的数量
  answer: 增长最快的操作类别（如嵌套循环内的比较）

- section: ch04_01
  question: 数组为什么能在 O(1) 时间内随机访问任意元素？
  options:
    - 数组存储在连续内存中，可通过首地址和索引直接计算元素地址
    - 数组内部维护了一张哈希表
    - 数组会对访问的元素做缓存
    - 编译器把数组展开成多个独立变量
  answer: 数组存储在连续内存中，可通过首地址和索引直接计算元素地址

- section: ch04_01
  question: 在数组中间位置插入一个元素的平均时间复杂度是？
  options:
    - O(n)，因为插入点之后的元素都要向后移动
    - O(1)
    - O(log n)
    - O(n log n)
  answer: O(n)，因为插入点之后的元素都要向后移动

- section: ch04_02
  question: 链表访问第 i 个节点的时间复杂度是 O(n)，原因是？
  options:
    - 节点在内存中分散存储，必须从头节点开始沿引用逐个遍历
    - 链表节点数量太多
    - 链表的节点都是只读的
    - 访问链表必须加锁
  answer: 节点在内存中分散存储，必须从头节点开始沿引用逐个遍历

- section: ch04_02
  question: 与数组相比，链表的主要优势是？
  options:
    - 插入和删除节点只需修改引用，无须移动其他元素
    - 支持O(1)随机访问
    - 占用内存更少
    - 缓存命中率更高
  answer: 插入和删除节点只需修改引用，无须移动其他元素

- section: ch04_03
  question: 「列表（list）」与「数组」的关系，理解正确的是？
  options:
    - 列表是基于数组实现的动态长度结构，支持自动扩容
    - 列表就是链表，二者完全等价
    - 列表的元素必须在内存中分散存储
    - 列表不支持索引访问
  answer: 列表是基于数组实现的动态长度结构，支持自动扩容

- section: ch04_04
  question: 为什么数组的实际效率常常优于链表，即使理论复杂度相同？
  options:
    - 数组连续存储，缓存命中率（缓存局部性）更高
    - 数组不需要内存
    - 链表的节点无法被 CPU 读取
    - 编译器对链表做了特殊优化
  answer: 数组连续存储，缓存命中率（缓存局部性）更高

- section: ch05_01
  question: 栈的元素遵循哪种出入顺序？
  options:
    - 后进先出（LIFO）
    - 先进先出（FIFO）
    - 按元素大小出栈
    - 随机顺序出栈
  answer: 后进先出（LIFO）

- section: ch05_01
  question: 以下哪一类应用最适合用栈实现？
  options:
    - 程序调用栈、括号匹配、深度优先搜索的回溯
    - 任务队列、消息缓冲
    - 按优先级调度的任务系统
    - 有序数据的快速查找
  answer: 程序调用栈、括号匹配、深度优先搜索的回溯

- section: ch05_02
  question: 队列的元素遵循哪种出入顺序？
  options:
    - 先进先出（FIFO）
    - 后进先出（LIFO）
    - 大元素先出队
    - 后进先出，但可插队
  answer: 先进先出（FIFO）

- section: ch05_02
  question: 用「动态数组实现的队列」把队首出队设为 O(n) 的原因是？
  options:
    - 出队后剩余所有元素都要向前移动一位
    - 队列必须重新排序
    - 动态数组的尾部无法访问
    - 出队需要遍历整个队列
  answer: 出队后剩余所有元素都要向前移动一位

- section: ch05_03
  question: 双向队列（deque）与普通队列相比的特点是？
  options:
    - 两端都可以入队和出队
    - 只能从中间插入元素
    - 元素自动保持有序
    - 不支持查看队首元素
  answer: 两端都可以入队和出队

- section: ch05_04
  question: 破坏性遍历（边遍历边删除）栈或队列时，正确的做法是？
  options:
    - 基于原结构的拷贝进行遍历，或先记录再删除
    - 直接边遍历边删除，没有任何风险
    - 先清空结构再遍历
    - 把结构转成字符串再操作
  answer: 基于原结构的拷贝进行遍历，或先记录再删除

- section: ch06_01
  question: 哈希表通过什么机制实现高效的元素查询？
  options:
    - 用哈希函数把 key 映射到桶数组下标，平均 O(1) 定位
    - 对所有元素逐个比较
    - 保持元素始终有序
    - 把所有 key 存进链表再搜索
  answer: 用哈希函数把 key 映射到桶数组下标，平均 O(1) 定位

- section: ch06_02
  question: 「链式地址」解决哈希冲突的做法是？
  options:
    - 每个桶指向一条链表，冲突的元素都挂在同一条链表上
    - 直接丢弃冲突的元素
    - 把哈希表容量减半
    - 把冲突元素存到另一张哈希表
  answer: 每个桶指向一条链表，冲突的元素都挂在同一条链表上

- section: ch06_02
  question: 以下哪种策略属于「开放寻址」解决哈希冲突？
  options:
    - 线性探测：冲突后依次向后寻找空桶
    - 给每个桶建一条链表
    - 把哈希函数换成恒等函数
    - 冲突时递归扩大 key 的位数
  answer: 线性探测：冲突后依次向后寻找空桶

- section: ch06_02
  question: 哈希表为什么需要在负载率过高时「扩容」？
  options:
    - 降低冲突概率，维持查询效率接近 O(1)
    - 为了节省内存
    - 为了让输出有序
    - 扩容可以删除所有冲突元素
  answer: 降低冲突概率，维持查询效率接近 O(1)

- section: ch06_03
  question: 哈希算法的设计目标不包括以下哪一项？
  options:
    - 把不同 key 尽可能映射到不同的输出（确定性哈希）
    - 输出分布尽量均匀
    - 计算过程尽量快
    - 保证能从哈希值反推出原始 key
  answer: 保证能从哈希值反推出原始 key

- section: ch07_01
  question: 满二叉树（perfect binary tree）的特性是？
  options:
    - 所有层的节点都达到最大值，节点总数为 2^h - 1
    - 只有叶子节点有值
    - 任意节点的左右子树高度差不超过 1
    - 节点值左小右大
  answer: 所有层的节点都达到最大值，节点总数为 2^h - 1

- section: ch07_02
  question: 二叉树的层序遍历通常借助哪种数据结构实现？
  options:
    - 队列
    - 栈
    - 哈希表
    - 堆
  answer: 队列

- section: ch07_02
  question: 前序、中序、后序遍历的访问顺序分别是？
  options:
    - 根-左-右 / 左-根-右 / 左-右-根
    - 左-根-右 / 根-左-右 / 左-右-根
    - 根-右-左 / 右-根-左 / 右-左-根
    - 左-右-根 / 左-根-右 / 根-左-右
  answer: 根-左-右 / 左-根-右 / 左-右-根

- section: ch07_02
  question: 二叉搜索树的中序遍历有一个重要性质，它是？
  options:
    - 遍历序列是升序的
    - 遍历序列是降序的
    - 遍历序列是随机的
    - 遍历只访问叶子节点
  answer: 遍历序列是升序的

- section: ch07_03
  question: 完全二叉树用数组表示时，节点索引为 i，其左孩子的索引是？
  options:
    - 2i + 1
    - i / 2
    - i + 1
    - 2i - 1
  answer: 2i + 1

- section: ch07_04
  question: 二叉搜索树（BST）的定义性质是？
  options:
    - 对任意节点，左子树所有节点值 < 该节点值 < 右子树所有节点值
    - 所有节点值都相等
    - 左子树深度必须等于右子树深度
    - 根节点必须是最大值
  answer: 对任意节点，左子树所有节点值 < 该节点值 < 右子树所有节点值

- section: ch07_05
  question: AVL 树通过什么机制维持平衡？
  options:
    - 在插入/删除后检测平衡因子，通过旋转（左旋、右旋等）恢复平衡
    - 定期重建整棵树
    - 随机交换左右子树
    - 限制节点数量
  answer: 在插入/删除后检测平衡因子，通过旋转（左旋、右旋等）恢复平衡

- section: ch07_06
  question: AVL 树查询效率优于普通 BST 的根本原因是？
  options:
    - 旋转使树高始终维持 O(log n)，避免了退化成链表
    - AVL 树的节点存储了更多信息
    - AVL 树自动排序所有值
    - AVL 树使用哈希索引
  answer: 旋转使树高始终维持 O(log n)，避免了退化成链表

- section: ch10_01
  question: 二分查找的前提条件是？
  options:
    - 数据必须有序，且支持随机访问（如数组）
    - 数据必须是无序的
    - 数据必须是链表存储
    - 数据量必须小于 1000
  answer: 数据必须有序，且支持随机访问（如数组）

- section: ch10_01
  question: 对长度为 n 的有序数组做二分查找，最差情况下比较次数的量级是？
  options:
    - O(log n)
    - O(n)
    - O(n log n)
    - O(1)
  answer: O(log n)

- section: ch10_02
  question: 二分查找插入点问题中，对一个存在重复元素的有序数组查找 target 的插入位置（保持有序），返回的通常是？
  options:
    - 最左边一个可以插入的位置（low 的最终值）
    - 数组中间位置
    - 最后一个等于 target 的位置加一
    - 任意空位
  answer: 最左边一个可以插入的位置（low 的最终值）

- section: ch10_03
  question: 二分查找中「左闭右开 [l, r)」与「左闭右闭 [l, r]」两种写法的区别在于？
  options:
    - 循环条件与边界收缩方式不同：前者 while l < r 且 r = m，后者 while l <= r 且 r = m - 1
    - 两者完全等价，没有任何区别
    - 前者只能查找整数，后者只能查找浮点数
    - 前者时间复杂度更低
  answer: 循环条件与边界收缩方式不同：前者 while l < r 且 r = m，后者 while l <= r 且 r = m - 1

- section: ch10_04
  question: 「哈希查找替代线性查找」优化的典型代价是？
  options:
    - 需要额外的 O(n) 空间来构建哈希表
    - 查询效率反而下降
    - 数据必须保持动态有序
    - 只能用于字符串数据
  answer: 需要额外的 O(n) 空间来构建哈希表

- section: ch10_05
  question: 以下搜索策略与其适用场景匹配错误的是？
  options:
    - 二分查找 —— 适合频繁插入删除的无序链表
    - 哈希查找 —— 适合对查询效率要求高、无须范围查询的数据
    - 线性搜索 —— 适合小型或频繁更新的数据
    - 树查找 —— 适合需要维护顺序并支持范围查询的数据
  answer: 二分查找 —— 适合频繁插入删除的无序链表

- section: ch11_01
  question: 评价排序算法的四个常用指标是？
  options:
    - 时间复杂度、空间复杂度、稳定性、原地性（以及自适应性）
    - 代码行数、注释量、变量数、函数数
    - 内存带宽、磁盘 IO、网络延迟、缓存大小
    - 输入规模、输出规模、CPU 型号、操作系统
  answer: 时间复杂度、空间复杂度、稳定性、原地性（以及自适应性）

- section: ch11_01
  question: 「稳定排序」的含义是？
  options:
    - 相等元素在排序后保持原有相对顺序
    - 排序结果不会随输入变化
    - 排序过程中不使用任何额外空间
    - 排序算法永远不报错
  answer: 相等元素在排序后保持原有相对顺序

- section: ch11_03
  question: 冒泡排序引入 flag 标志位优化的目的是？
  options:
    - 某轮未发生任何交换时提前返回，把最佳复杂度优化到 O(n)
    - 减少数组占用的内存
    - 让冒泡排序变成稳定排序
    - 避免数组越界
  answer: 某轮未发生任何交换时提前返回，把最佳复杂度优化到 O(n)

- section: ch11_04
  question: 插入排序在什么场景下效率相对突出？
  options:
    - 数据量较小或基本有序时，实际操作次数少
    - 数据完全逆序且规模巨大时
    - 数据全部是字符串时
    - 需要外存排序时
  answer: 数据量较小或基本有序时，实际操作次数少

- section: ch11_05
  question: 快速排序「哨兵划分」完成后，基准数处于什么状态？
  options:
    - 已位于它最终有序位置上，左侧都 ≤ 它，右侧都 ≥ 它
    - 位于数组最左端
    - 位于数组最右端
    - 位置随机，与有序位置无关
  answer: 已位于它最终有序位置上，左侧都 ≤ 它，右侧都 ≥ 它

- section: ch11_05
  question: 快速排序最差时间复杂度为 O(n²) 的典型输入是？
  options:
    - 每次哨兵划分都选到最差基准数（如已排序数组取首元素为基准）
    - 数组元素全部互不相等
    - 数组长度是 2 的幂
    - 数组元素都是正数
  answer: 每次哨兵划分都选到最差基准数（如已排序数组取首元素为基准）

- section: ch11_06
  question: 归并排序「分而后合」的两个阶段是？
  options:
    - 划分（递归二分）与合并（合并两个有序子数组）
    - 建堆与下沉
    - 打散与哈希
    - 选择与插入
  answer: 划分（递归二分）与合并（合并两个有序子数组）

- section: ch11_07
  question: 堆排序建堆完成后，排序阶段的每次循环会做什么？
  options:
    - 把堆顶（最大值）与堆底交换，然后对剩余堆执行从顶至下的堆化
    - 重新建立一个新的堆
    - 把堆底元素删除
    - 对数组做一次插入排序
  answer: 把堆顶（最大值）与堆底交换，然后对剩余堆执行从顶至下的堆化

- section: ch11_09
  question: 计数排序适用于什么数据？
  options:
    - 数据量大但取值范围有限、可转换为非负整数的数据
    - 任意浮点数数据
    - 取值范围无限的数据
    - 只有负数的数据（不处理直接排）
  answer: 数据量大但取值范围有限、可转换为非负整数的数据

- section: ch11_10
  question: 基数排序的核心思想是？
  options:
    - 从低位到高位逐位进行「稳定排序」，依赖每一位的排序结果
    - 按元素数值开方后分桶
    - 把所有元素转为字符串后比较长度
    - 每轮随机选一个位排序
  answer: 从低位到高位逐位进行「稳定排序」，依赖每一位的排序结果

- section: ch14_01
  question: 动态规划解决问题的核心思路是？
  options:
    - 把原问题分解为重叠子问题，用 dp 表记录子问题的解，避免重复计算
    - 每一步都选择当前最优解，绝不回头
    - 随机搜索所有可能的解
    - 用排序预处理后再贪心
  answer: 把原问题分解为重叠子问题，用 dp 表记录子问题的解，避免重复计算

- section: ch14_02
  question: 一道题适合用动态规划的两个关键特征是？
  options:
    - 重叠子问题 + 最优子结构
    - 无后效性 + 必须递归
    - 数据必须有序 + 必须原地
    - 输入必须全是整数 + 输出必须唯一
  answer: 重叠子问题 + 最优子结构

- section: ch14_03
  question: 在动态规划中，「状态转移方程」的作用是？
  options:
    - 描述较大规模问题的解如何由更小子问题的解推导得出
    - 定义输入数据的存储格式
    - 描述程序的退出条件
    - 决定输出保留几位小数
  answer: 描述较大规模问题的解如何由更小子问题的解推导得出

- section: ch14_04
  question: 0-1 背包问题中，「物品只能选一次」的状态转移约束体现在？
  options:
    - 递推时只允许从「不选当前物品」或「选一次并扣除容量」两种来源转移
    - 每个物品可以无限次选入
    - 背包容量必须等于物品总重
    - 价值必须全部相同
  answer: 递推时只允许从「不选当前物品」或「选一次并扣除容量」两种来源转移

- section: ch14_05
  question: 完全背包与 0-1 背包在状态转移上的关键差别是？
  options:
    - 完全背包每件物品可重复选取，正向遍历容量即可复用当前行结果
    - 完全背包不允许选择任何物品
    - 两者完全相同
    - 完全背包必须先排序物品
  answer: 完全背包每件物品可重复选取，正向遍历容量即可复用当前行结果

- section: ch14_06
  question: 编辑距离问题中，把一个单词变成另一个单词允许的三种操作是？
  options:
    - 插入一个字符、删除一个字符、替换一个字符
    - 只能插入和删除
    - 只能整体翻转
    - 复制、粘贴、剪切
  answer: 插入一个字符、删除一个字符、替换一个字符
